<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steel Concordat</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Concordat">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAF0; --panel:#FFFFFF; --panel2:#F2F4F8; --panel3:#E3E8EF; --line:#C9D1DC;
  --text:#18212E; --muted:#5A6A80; --amber:#A8620A; --amber-ink:#FFFFFF; --amber-soft:rgba(240,166,58,.18);
  --danger:#C7353A; --good:#1E8A5A; --hollow:#7A3FD0; --cyan:#13879A; --warn:#B07A00;
  --guild:#2F7DD1; --guild2:#F0A63A;
  --rt0:#C7353A; --rt1:#D2691E; --rt2:#A88300; --rt3:#2E9A4E; --rt4:#1C7FC9; --rt5:#8E44D9;
  --shadow:0 1px 0 rgba(20,30,45,.06);
  --fh:'Chakra Petch', 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --fb:'Barlow', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A26; --panel:#1A2433; --panel2:#202C3D; --panel3:#283548; --line:#334257;
    --text:#E6EBF2; --muted:#8C9AAF; --amber:#F0A63A; --amber-ink:#1A1206; --amber-soft:rgba(240,166,58,.14);
    --danger:#F0595E; --good:#4CCB90; --hollow:#B07CFF; --cyan:#4FD1E0; --warn:#E9C24A;
    --rt0:#F0595E; --rt1:#F0954A; --rt2:#E9C24A; --rt3:#5CD68A; --rt4:#52B8F5; --rt5:#C38BFF;
    --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A26; --panel:#1A2433; --panel2:#202C3D; --panel3:#283548; --line:#334257;
  --text:#E6EBF2; --muted:#8C9AAF; --amber:#F0A63A; --amber-ink:#1A1206; --amber-soft:rgba(240,166,58,.14);
  --danger:#F0595E; --good:#4CCB90; --hollow:#B07CFF; --cyan:#4FD1E0; --warn:#E9C24A;
  --rt0:#F0595E; --rt1:#F0954A; --rt2:#E9C24A; --rt3:#5CD68A; --rt4:#52B8F5; --rt5:#C38BFF;
  --shadow:none; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--fb); font-size:14px; line-height:1.4; overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
button{font:inherit; color:inherit}
h1,h2,h3,h4{font-family:var(--fh); margin:0; font-weight:600; letter-spacing:.01em}
h1{font-size:30px; line-height:1.1}
h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.good{color:var(--good)} .bad{color:var(--danger)} .warnc{color:var(--warn)}
#app{position:relative; height:100%; display:flex; flex-direction:column}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:0 16px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-family:var(--fh); font-weight:600; font-size:14px; white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,.navb:focus-visible,.card:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.btn.primary{background:var(--amber); border-color:var(--amber); color:var(--amber-ink)}
.btn.danger{border-color:var(--danger); color:var(--danger); background:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px; padding:0 10px; font-size:13px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:8px; align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.col{display:flex; flex-direction:column; gap:8px}
.spacer{height:12px}

/* shell */
#topbar{height:44px; flex:none; display:flex; align-items:center; gap:14px; padding:0 14px 0 10px; background:var(--panel); border-bottom:1px solid var(--line)}
#topbar .gname{font-family:var(--fh); font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px}
#topbar .stat{display:flex; flex-direction:column; line-height:1.05}
#topbar .stat b{font-family:var(--fh); font-size:14px}
#topbar .stat span{font-size:10.5px; color:var(--muted)}
#main{flex:1; display:flex; min-height:0}
#rail{width:68px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:6px 0; gap:2px}
.navb{display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 2px; border:none; background:none; cursor:pointer; color:var(--muted); font-size:11px; font-family:var(--fh); border-left:3px solid transparent}
.navb svg{width:22px; height:22px}
.navb.on{color:var(--text); border-left-color:var(--amber); background:var(--amber-soft)}
.navb .dot{position:absolute}
#view{flex:1; min-width:0; overflow:auto; position:relative}
.page{padding:14px 16px 90px}
.pane2{display:grid; grid-template-columns:minmax(240px,340px) 1fr; gap:14px; align-items:start}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; box-shadow:var(--shadow)}
.panel h3{margin-bottom:8px}
.list{display:flex; flex-direction:column; gap:6px}
.tabs{display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap}
.tab{padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:transparent; cursor:pointer; font-family:var(--fh); font-weight:600; font-size:13px}
.tab.on{background:var(--panel3); border-color:var(--muted)}
#continue{position:fixed; right:calc(14px + env(safe-area-inset-right,0px)); bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:30; min-height:52px; padding:0 22px; font-size:16px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* cards */
.card{display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); cursor:pointer; text-align:left; width:100%}
.card.on{border-color:var(--amber); background:var(--amber-soft)}
.card .meta{flex:1; min-width:0}
.card .nm{font-family:var(--fh); font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ovr{font-family:var(--fh); font-weight:700; font-size:20px; min-width:34px; text-align:center}
.portrait{width:44px; height:44px; flex:none; border-radius:6px; overflow:hidden; background:var(--panel3)}
.portrait svg{width:100%; height:100%; display:block}
.portrait.lg{width:120px; height:120px; border-radius:10px}
.portrait.md{width:72px; height:72px}
.chip{display:inline-flex; align-items:center; gap:4px; padding:1px 8px; border-radius:20px; font-size:11.5px; border:1px solid var(--line); background:var(--panel2); white-space:nowrap}
.chip.cls{font-family:var(--fh); font-weight:600}
.chip.c-LR{color:#E38B2C} .chip.c-SUP{color:#2FB37A} .chip.c-MEL{color:#E0525A} .chip.c-TNK{color:#4C8FE0} .chip.c-CTL{color:#A46CF0}
.chip.inj{color:var(--danger); border-color:var(--danger)}
.chip.away{color:var(--cyan); border-color:var(--cyan)}
.chip.risk-0{color:var(--good)} .chip.risk-1{color:#7BB33A} .chip.risk-2{color:var(--warn)} .chip.risk-3{color:#E2762C} .chip.risk-4{color:var(--danger); border-color:var(--danger)}
.bar{height:6px; border-radius:3px; background:var(--panel3); overflow:hidden; position:relative}
.bar > i{display:block; height:100%; background:var(--amber)}
.bar.hp > i{background:var(--good)}
.bar.heat > i{background:#E2762C}
.rt0{--rc:var(--rt0)} .rt1{--rc:var(--rt1)} .rt2{--rc:var(--rt2)} .rt3{--rc:var(--rt3)} .rt4{--rc:var(--rt4)} .rt5{--rc:var(--rt5)}
.ovr.rt{color:var(--rc); background:color-mix(in srgb, var(--rc) 13%, transparent); border:1px solid color-mix(in srgb, var(--rc) 45%, transparent); border-radius:6px; padding:1px 5px; line-height:1.25}
.ovr.rt.pot{background:transparent; border-style:dashed}
.pstars{position:relative; display:inline-block; font-size:13px; line-height:1; letter-spacing:1px; white-space:nowrap; vertical-align:middle}
.pstars .ps0{color:rgba(160,170,185,.28)}
.pstars .ps1, .pstars .ps2{position:absolute; left:0; top:0; overflow:hidden; color:#F2C14E; text-shadow:0 0 6px rgba(242,193,78,.45)}
.pstars .ps2{color:rgba(242,193,78,.35); text-shadow:none}
.bar.rt > i{background:var(--rc)}
.sv{font-weight:700; color:var(--rc); font-family:var(--fh)}
.rtlegend{display:flex; gap:8px; flex-wrap:wrap; font-size:10.5px; color:var(--muted); margin-top:4px}
.rtlegend i{display:inline-block; width:8px; height:8px; border-radius:2px; background:var(--rc); margin-right:3px; vertical-align:-1px}
.league-next .bigcount{font-family:var(--fh); font-size:34px; font-weight:700; line-height:1; color:var(--amber)}
.league-next.hot{border-color:var(--amber); box-shadow:0 0 0 3px var(--amber-soft)}
.seasonbar{position:relative; height:8px; border-radius:4px; background:var(--panel3); margin:10px 0 4px}
.seasonbar b{position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--amber); opacity:.55}
.seasonbar i{position:absolute; top:-3px; width:2px; height:14px; background:var(--text); opacity:.6}
.seasonbar em{position:absolute; top:-4px; width:12px; height:16px; margin-left:-6px; border-radius:3px; background:var(--amber); border:2px solid var(--panel)}
.leaguechip{display:flex; flex-direction:column; line-height:1.05; padding:3px 9px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); cursor:pointer; text-align:left}
.leaguechip b{font-family:var(--fh); font-size:14px; color:var(--amber)} .leaguechip span{font-size:10.5px; color:var(--muted)}
.leaguechip.hot{border-color:var(--amber); background:var(--amber-soft)}
table.t.train td, table.t.train th{padding:4px 5px; white-space:nowrap}
table.t.train .num{text-align:center; width:34px}
table.t.train tr.grp td{background:var(--panel2); padding-top:8px}
table.t.train tr.dim td{opacity:.6}
table.t.train .portrait{width:34px; height:34px}
.ticon{width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:6px; background:var(--panel2); color:var(--muted); cursor:pointer; padding:0; font-family:var(--fh); font-weight:700; font-size:12px}
.ticon:hover{border-color:var(--muted); color:var(--text)} .ticon.on{background:var(--amber); border-color:var(--amber); color:var(--amber-ink)} .ticon[disabled]{opacity:.35; cursor:not-allowed}
.tsel{min-height:30px !important; font-size:12px; padding:0 4px !important}
.sv.drilling{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px}
.mini{width:46px; height:4px; border-radius:2px; background:var(--panel3); overflow:hidden; margin:2px 0} .mini i{display:block; height:100%}
.trn-rest{color:var(--good)} .trn-drill{color:var(--amber)} .trn-tactics{color:var(--cyan)} .trn-mentor{color:var(--hollow)}
.chip.trn-rest,.chip.trn-drill,.chip.trn-tactics,.chip.trn-mentor{border-color:currentColor}
.statrow{display:grid; grid-template-columns:86px 1fr 30px; gap:8px; align-items:center; font-size:12.5px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mechwin{position:relative; height:120px; border-radius:10px; overflow:hidden; background:var(--panel2); box-shadow:0 0 0 1px var(--line)}
.mechwin canvas{width:100%; height:100%; display:block}
.mechwin .mwlabel{position:absolute; left:8px; bottom:6px; font-size:12px; text-shadow:0 1px 2px #000; color:#E6EBF2}
.mechwin .mwlabel span{opacity:.7}
.mechwin .mwempty{display:flex; height:100%; align-items:center; justify-content:center; color:var(--muted); font-size:13px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
table.t{width:100%; border-collapse:collapse; font-size:13px}
table.t th{text-align:left; color:var(--muted); font-weight:500; font-size:12px; padding:4px 6px; border-bottom:1px solid var(--line)}
table.t td{padding:6px; border-bottom:1px solid var(--line)}
table.t tr.me td{background:var(--amber-soft); font-weight:600}
.banner{display:inline-block; flex:none}
select,input[type=text]{font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:6px; min-height:36px; padding:0 8px}
input[type=range]{accent-color:var(--amber)}

/* modal */
#modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(8,12,20,.55); padding:12px}
#modal.on{display:flex}
#modal .box{background:var(--panel); border:1px solid var(--line); border-radius:10px; max-width:640px; width:100%; max-height:calc(100% - 16px); overflow:auto; padding:16px}
#toast{position:fixed; left:50%; top:54px; transform:translateX(-50%); z-index:70; background:var(--panel3); border:1px solid var(--line); padding:8px 14px; border-radius:8px; display:none; font-size:13px}

/* title & setup */
.fullpage{position:absolute; inset:0; overflow:auto; background:var(--bg); z-index:20}
.title-wrap{min-height:100%; display:grid; grid-template-columns:1.1fr 1fr; align-items:center; gap:24px; padding:24px 40px}
.title-wrap h1{font-size:56px; line-height:.95; font-weight:700}
.title-art{width:100%; aspect-ratio:16/10; border-radius:12px; overflow:hidden; background:#0E141E; position:relative}
.title-art canvas{width:100%; height:100%; display:block}
.setup{padding:18px 24px 90px; max-width:1100px; margin:0 auto}
.choice-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px}
.choice{padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); cursor:pointer; text-align:left}
.choice.on{border-color:var(--amber); background:var(--amber-soft)}
.choice h3{margin-bottom:4px}
.steps{display:flex; gap:6px; margin-bottom:12px}
.steps i{flex:1; height:4px; border-radius:2px; background:var(--panel3)}
.steps i.on{background:var(--amber)}
.draftcard{min-width:0; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--panel); cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:6px}
.draftcard:hover{border-color:var(--amber)}
.swatch{width:28px; height:28px; border-radius:6px; border:2px solid transparent; cursor:pointer}
.swatch.on{border-color:var(--text); box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--text)}
.swatch.used{opacity:.35; cursor:not-allowed; position:relative}
.swatch.used span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:700 12px var(--fh); color:#fff; text-shadow:0 1px 2px #000}
#modal .box:has(.paintshop){max-width:860px}
.swatch.custom{position:relative; overflow:hidden; display:inline-block}
.swatch.custom input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0}
.shell{padding:2px; border-radius:8px; border:2px solid var(--line); background:var(--panel2); cursor:pointer; line-height:0}
.shell.on{border-color:var(--text); box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--text)}
.preset{display:inline-flex; align-items:center; gap:6px}
.pdots{display:inline-flex}.pdots i{width:10px; height:10px; border-radius:50%; margin-left:-3px; border:1px solid rgba(0,0,0,.4)}.pdots i:first-child{margin-left:0}
.swatch.em{width:42px; height:42px; padding:6px; display:inline-flex; align-items:center; justify-content:center; border-color:var(--line)}
.swatch.em.on{border-color:var(--text)}

/* pre-battle */
.formation{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,58px); gap:6px; position:relative}
.fcell{border:1px dashed var(--line); border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:11px; color:var(--muted); position:relative; background:var(--panel2)}
.fcell.sel{border-color:var(--amber); border-style:solid}
.fcell .fm{display:flex; flex-direction:column; align-items:center; color:var(--text); font-family:var(--fh); font-size:12px}
.rulebody{display:flex; flex-direction:column; gap:4px; min-width:0}
.rule{display:grid; grid-template-columns:22px 1fr 34px; gap:6px; align-items:center; padding:5px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); margin-bottom:5px}
.rule.locked{opacity:.45}
.rule select{min-height:30px; font-size:12.5px; width:100%}
.rule .num{font-family:var(--fh); color:var(--muted); text-align:center}

/* expedition map */
.nodemap{position:relative; height:280px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.nodemap svg{position:absolute; inset:0; width:100%; height:100%}
.node{position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; border:none; background:transparent; padding:0; display:flex; align-items:center; justify-content:center; cursor:default; filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)); transition:transform .12s}
.node[data-t="boss"]{width:56px; height:56px; margin:-28px 0 0 -28px}
.node.avail{cursor:pointer; animation:nodepulse 1.4s ease-in-out infinite}
.node.avail:hover{transform:scale(1.12)}
@keyframes nodepulse{0%,100%{filter:drop-shadow(0 0 0 var(--amber)) drop-shadow(0 2px 2px rgba(0,0,0,.3))} 50%{filter:drop-shadow(0 0 7px var(--amber)) drop-shadow(0 2px 2px rgba(0,0,0,.3))}}
.node.done{opacity:.4; filter:grayscale(.7)}
.node.cur{outline:3px solid var(--good); outline-offset:2px; border-radius:50%}
.nodelegend{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px} .nodelegend span{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted)} .nodelegend i{width:18px; height:18px; display:inline-block}

/* battle */
#battle{position:fixed; inset:0; z-index:40; background:#0B1018; display:none}
#battle.on{display:block}
#btitle,#bside,#bctrl,#cutin,#bresult{z-index:2}
#battle::after{content:''; position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse at 45% 50%, transparent 55%, rgba(0,0,0,.45) 100%)}
#bcanvas{position:absolute; left:0; top:0; touch-action:none}
#bside{position:absolute; top:calc(8px + env(safe-area-inset-top,0px)); right:calc(8px + env(safe-area-inset-right,0px)); bottom:calc(8px + env(safe-area-inset-bottom,0px)); width:188px; display:flex; flex-direction:column; gap:5px; pointer-events:none}
.bcard{pointer-events:auto; background:rgba(14,20,30,.78); border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:5px 7px; color:#E6EBF2; cursor:pointer}
.bcard.sel{border-color:#F0A63A}
.bcard.dead{opacity:.45}
.bcard .bn{font-family:var(--fh); font-size:12px; font-weight:600; display:flex; justify-content:space-between}
.bcard .sec{display:grid; grid-template-columns:repeat(3,1fr); gap:3px; margin-top:3px}
.bcard .sec .bar{height:4px; background:rgba(255,255,255,.12)}
.bcard .rl{font-size:10.5px; color:#AEB9C9; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bcard .gauge{height:3px; margin-top:3px; background:rgba(255,255,255,.12); border-radius:2px; overflow:hidden}
.bcard .gauge i{display:block; height:100%; background:#4FD1E0}
.bcard .cds{display:flex; gap:3px; margin-top:3px; flex-wrap:wrap}
.bcard .cdp{position:relative; flex:1; min-width:26px; height:13px; border-radius:3px; background:rgba(255,255,255,.1); overflow:hidden}
.bcard .cdp i{position:absolute; left:0; top:0; bottom:0; opacity:.45}
.bcard .cdp b{position:relative; z-index:1; display:block; text-align:center; font-size:8.5px; line-height:13px; font-family:var(--fh); color:#C9D3E0; letter-spacing:.02em}
.bcard .cdp.rdy b{color:#fff}
.bcard .cdp.boost{outline:1px solid rgba(159,232,255,.35)}
#bctrl{position:absolute; left:calc(10px + env(safe-area-inset-left,0px)); bottom:calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:6px}
#bctrl .btn{background:rgba(14,20,30,.8); color:#E6EBF2; border-color:rgba(255,255,255,.18); min-height:36px}
#bctrl .btn.on{border-color:#F0A63A; color:#F0A63A}
#btitle{position:absolute; left:calc(12px + env(safe-area-inset-left,0px)); top:calc(8px + env(safe-area-inset-top,0px)); color:#E6EBF2; font-family:var(--fh); text-shadow:0 1px 3px #000; pointer-events:none}
#btitle b{font-size:15px} #btitle div{font-size:11.5px; color:#AEB9C9}
#cutin{position:absolute; left:0; right:200px; top:38%; height:96px; pointer-events:none; display:none; overflow:hidden}
#cutin.on{display:block}
#cutin .strip{position:absolute; inset:0; display:flex; align-items:center; gap:14px; padding-left:8%; animation:cut 1.5s ease-out forwards}
#cutin .face{width:140px; height:96px; overflow:hidden; border-radius:4px; transform:skewX(-12deg); border:2px solid #fff}
#cutin .face svg{width:140px; height:auto; margin-top:-32px; transform:skewX(12deg) scale(1.2)}
#cutin .txt{font-family:var(--fh); color:#fff; text-shadow:0 2px 6px #000}
#cutin .txt b{font-size:28px; display:block; font-style:italic}
#cutin .txt span{font-size:13px; opacity:.85}
@keyframes cut{0%{transform:translateX(-110%)} 15%{transform:translateX(0)} 80%{transform:translateX(0); opacity:1} 100%{transform:translateX(30%); opacity:0}}
#bresult{position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,8,14,.55)}
#bresult.on{display:flex}
#bresult .big{font-family:var(--fh); font-size:48px; font-weight:700; color:#fff; text-shadow:0 3px 12px #000}

#rotate{position:fixed; inset:0; z-index:200; background:var(--bg); display:none; align-items:center; justify-content:center; text-align:center; padding:30px}
@media (orientation: portrait) and (max-width: 820px){ #rotate{display:flex} }
@media (max-height: 460px){
  .page{padding:10px 12px 80px}
  #topbar{height:40px}
  h1{font-size:24px}
  .title-wrap h1{font-size:40px}
  .title-wrap{padding:14px 20px}
  .nodemap{height:220px}
  .formation{grid-template-rows:repeat(3,48px)}
}
@media (max-width: 900px){ #bside{width:148px} .bcard .rl{font-size:9.5px} .bcard .bn{font-size:11px} }
@media (prefers-reduced-motion: reduce){ #cutin .strip{animation-duration:.01s} }
/* ===================== VISUAL OVERHAUL (tactical console) ===================== */
:root{
  --bg:#E4E9EF; --panel:#FBFCFD; --panel2:#EFF3F7; --panel3:#E0E6EE; --line:#CBD3DE; --text:#121A25; --muted:#5A6A7F;
  --grid:rgba(20,40,70,.045); --rail:#141C27; --railtx:#8C9AAE; --railon:#FFFFFF; --hi:rgba(255,255,255,.7);
  --g1:#2F7DD1; --g2:#E2A52B; --g3:#D9DCE2; --acc:var(--amber); --r:6px;
  --shadow:0 1px 2px rgba(15,25,40,.06), 0 4px 14px -6px rgba(15,25,40,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0A1018; --panel:#111924; --panel2:#17212D; --panel3:#1F2B3A; --line:#283649; --text:#E2E8F0; --muted:#8495AB;
    --grid:rgba(120,160,220,.05); --rail:#0C121B; --hi:rgba(255,255,255,.04); --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px -8px rgba(0,0,0,.6); }
}
:root[data-theme="dark"]{ --bg:#0A1018; --panel:#111924; --panel2:#17212D; --panel3:#1F2B3A; --line:#283649; --text:#E2E8F0; --muted:#8495AB;
  --grid:rgba(120,160,220,.05); --rail:#0C121B; --hi:rgba(255,255,255,.04); --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px -8px rgba(0,0,0,.6); }

body{letter-spacing:.005em}
#view, .fullpage{
  background:
    radial-gradient(900px 420px at 85% -8%, color-mix(in srgb, var(--g1) 13%, transparent), transparent 70%),
    radial-gradient(700px 380px at -5% 105%, color-mix(in srgb, var(--g2) 8%, transparent), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
    var(--bg);
}
h1,h2,h3,h4{letter-spacing:.02em}
h2{font-size:21px}

/* top bar */
#topbar{height:50px; position:relative; gap:16px; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line); box-shadow:var(--shadow); z-index:2}
#topbar::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:linear-gradient(90deg, var(--g1) 0 34%, var(--g2) 34% 67%, var(--g3) 67%)}
#topbar .gname{font-size:16px; letter-spacing:.03em; text-transform:uppercase}
#topbar .stat{padding-left:12px; border-left:1px solid var(--line)}
#topbar .stat b{font-size:15px}
#topbar .stat span{text-transform:uppercase; letter-spacing:.06em; font-size:9.5px}

/* rail */
#rail{width:74px; background:var(--rail); border-right:none; padding:8px 0; gap:4px}
.navb{color:var(--railtx); border-left:none; position:relative; margin:0 7px; border-radius:8px; padding:9px 2px 7px; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; transition:background .15s, color .15s}
.navb:hover{color:#fff; background:rgba(255,255,255,.05)}
.navb.on{color:var(--railon); background:linear-gradient(180deg, color-mix(in srgb, var(--g1) 40%, transparent), color-mix(in srgb, var(--g1) 18%, transparent)); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--g1) 60%, transparent)}
.navb.on::before{content:''; position:absolute; left:-7px; top:10px; bottom:10px; width:3px; border-radius:0 3px 3px 0; background:var(--g2)}
.navb svg{width:23px; height:23px}

/* panels */
.panel{position:relative; border-radius:var(--r); border:1px solid var(--line); background:linear-gradient(180deg, var(--hi), transparent 40px), var(--panel); box-shadow:var(--shadow)}
.panel::before{content:''; position:absolute; left:-1px; top:-1px; width:16px; height:16px; border-left:2px solid var(--acc); border-top:2px solid var(--acc); border-top-left-radius:var(--r); pointer-events:none; opacity:.9}
.panel::after{content:''; position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-right:2px solid var(--line); border-bottom:2px solid var(--line); border-bottom-right-radius:var(--r); pointer-events:none}
.panel > h3, .panel > .row > h3, .panel > .row > div > h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:700}
.panel > h3::before, .panel > .row > h3::before{content:''; display:inline-block; width:6px; height:6px; margin-right:7px; background:var(--acc); transform:rotate(45deg) translateY(-2px)}

/* buttons */
.btn{border-radius:5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; font-size:12.5px; background:var(--panel2); transition:border-color .12s, background .12s, transform .06s}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg, color-mix(in srgb, var(--amber) 82%, #fff), var(--amber)); box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 4px 12px -4px color-mix(in srgb, var(--amber) 70%, transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{font-size:11.5px}
#nextday{position:fixed; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:30; min-height:52px; padding:0 18px; font-size:15px; letter-spacing:.06em; border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.25)}
#continue .simto{display:block; line-height:1.1}
#continue .simday{display:block; font-size:10.5px; letter-spacing:.06em; opacity:.75; text-transform:none; margin-top:2px}
#continue{border-radius:6px; padding:0 26px 0 22px; letter-spacing:.08em; clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); padding-right:34px}

/* tabs as segmented control */
.tabs{display:inline-flex; gap:2px; padding:3px; background:var(--panel2); border:1px solid var(--line); border-radius:8px}
.tab{border:none; border-radius:6px; padding:6px 13px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-size:11.5px}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12); border:none}
.page > .tabs, .page > .tabs + .pane2 .tabs{margin-bottom:12px}

/* cards & chips */
.card{border-radius:var(--r); background:var(--panel); transition:border-color .12s, transform .12s; position:relative}
.card:hover{border-color:var(--muted)}
.card.on{border-color:var(--acc); background:linear-gradient(90deg, var(--amber-soft), transparent 70%), var(--panel)}
.card.on::before{content:''; position:absolute; left:-1px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--acc)}
.chip{border-radius:4px; font-size:11px; letter-spacing:.02em}
.chip.cls{text-transform:uppercase; font-size:10px; letter-spacing:.07em}
.portrait{border-radius:6px; box-shadow:0 0 0 1px var(--line)}
.bar{height:6px; border-radius:2px}
.bar > i{border-radius:2px}
table.t th{text-transform:uppercase; letter-spacing:.07em; font-size:10.5px}
table.t tr:hover td{background:color-mix(in srgb, var(--panel2) 70%, transparent)}
#modal{backdrop-filter:blur(2px)}
#modal .box{border-radius:10px; border-top:3px solid var(--acc); box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
#toast{border-radius:6px; border-left:3px solid var(--acc); box-shadow:var(--shadow); font-family:var(--fh); letter-spacing:.03em}
select,input[type=text]{border-radius:5px}

/* title */
.title-wrap h1{font-size:clamp(40px, 4.6vw, 62px); text-transform:uppercase; letter-spacing:.02em; background:linear-gradient(180deg, var(--text) 40%, color-mix(in srgb, var(--text) 45%, var(--amber))); -webkit-background-clip:text; background-clip:text; color:transparent}
.title-wrap .kicker{font-family:var(--fh); color:var(--amber); letter-spacing:.3em; text-transform:uppercase; font-size:12px}
.title-art{border-radius:10px; box-shadow:0 30px 60px -20px rgba(0,0,0,.6), 0 0 0 1px var(--line); position:relative}
.title-art::after{content:''; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45)); border-radius:10px}
.title-art .hud{position:absolute; left:12px; top:10px; font-family:var(--fh); font-size:11px; letter-spacing:.2em; color:rgba(220,240,255,.75); z-index:1; pointer-events:none}
.steps i{height:3px; border-radius:0}
.choice, .draftcard{border-radius:var(--r); transition:border-color .12s, transform .12s}
.choice:hover, .draftcard:hover{transform:translateY(-2px); border-color:var(--amber)}

/* battle side cards */
.bcard{border-radius:6px; background:linear-gradient(180deg, rgba(255,255,255,.04), transparent 24px), rgba(12,18,28,.82); border-color:rgba(255,255,255,.08); border-left:3px solid var(--g1)}
#bctrl .btn{text-transform:uppercase}

/* ===== sector map (expeditions) ===== */
.exp-head{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap}
.exp-head .kick{font-family:var(--fh); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--amber)}
.exp-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.exp-meta .chip{background:var(--panel)}
.sector{position:relative; width:100%; aspect-ratio:1000/400; border-radius:10px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow); background:#1A2029; isolation:isolate}
.sector > svg.terrain{position:absolute; inset:0; width:100%; height:100%; display:block}
.sector .node{width:5.2%; height:auto; aspect-ratio:1; margin:0; transform:translate(-50%,-50%); filter:none; animation:none}
.sector .node[data-t="boss"], .sector .node[data-t="ace"], .sector .node[data-t="objective"]{width:6.6%}
.sector .node svg{filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.sector .node.avail::after{content:''; position:absolute; inset:-14%; border-radius:50%; border:2px solid var(--amber); animation:ring 1.6s ease-out infinite; pointer-events:none}
.sector .node.avail:hover{transform:translate(-50%,-50%) scale(1.1)}
.sector .node.done{opacity:.55; filter:grayscale(.85)}
.sector .node.sel::before{content:''; position:absolute; inset:-22%; border-radius:50%; border:2px dashed #fff; animation:spin 6s linear infinite; pointer-events:none}
.sector .node.cur{outline:none}
.sector .nlabel{position:absolute; transform:translate(-50%, 0); font-family:var(--fh); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#fff; text-shadow:0 1px 2px #000, 0 0 6px rgba(0,0,0,.8); white-space:nowrap; pointer-events:none}
.sector .nlabel.av{color:#FFD58A}
.sector .squadpin{position:absolute; transform:translate(-50%,-100%); pointer-events:none; filter:drop-shadow(0 3px 3px rgba(0,0,0,.6)); animation:bob 2.4s ease-in-out infinite}
.sector .maptitle{position:absolute; left:14px; top:10px; font-family:var(--fh); color:rgba(235,242,250,.92); text-shadow:0 1px 2px #000; pointer-events:none}
.sector .maptitle b{display:block; font-size:12px; letter-spacing:.22em; text-transform:uppercase}
.sector .maptitle span{font-size:11px; opacity:.75; letter-spacing:.06em}
.route-av{stroke-dasharray:10 8; animation:march 1s linear infinite}
@keyframes ring{0%{transform:scale(.8); opacity:.9} 100%{transform:scale(1.35); opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes march{to{stroke-dashoffset:-18}}
@keyframes bob{0%,100%{margin-top:0} 50%{margin-top:-4px}}
.exp-side .nodehead{display:flex; gap:10px; align-items:center; margin-bottom:6px}
.exp-side .nodehead .em{width:44px; height:44px; flex:none}
.exp-side .kv{display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12.5px; margin:8px 0}
.exp-side .kv span{color:var(--muted)}
.squadstrip{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px}
.squadstrip .mcard{display:flex; gap:8px; align-items:center; padding:7px 8px; border-radius:var(--r); background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--g1); min-width:0}
.squadstrip .mcard.res{border-left-color:var(--line)}
.squadstrip .mcard.dead{opacity:.55; border-left-color:var(--danger)}
@media (max-height:460px){ .sector{aspect-ratio:1000/330} }
@media (prefers-reduced-motion: reduce){ .route-av, .sector .node.avail::after, .sector .squadpin, .sector .node.sel::before{animation:none} }

/* market cards */
.mgridwrap{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px}
.mcard{display:flex; flex-direction:column; gap:7px; border-top:3px solid var(--mc)}
.mcard::before{border-color:var(--mc)}
.micon{display:inline-flex; align-items:center; justify-content:center; flex:none; border-radius:8px; color:var(--mc); background:color-mix(in srgb, var(--mc) 14%, var(--panel2)); border:1px solid color-mix(in srgb, var(--mc) 45%, transparent)}
.mname{font-family:var(--fh); font-size:15px; letter-spacing:.02em}
.mk{font-family:var(--fh); font-weight:700; font-size:11px; padding:1px 7px; border-radius:4px; color:#fff; background:var(--mk); letter-spacing:.04em}
.slotchip{color:var(--mc); border-color:color-mix(in srgb, var(--mc) 50%, transparent); text-transform:uppercase; font-size:10px; letter-spacing:.07em; font-family:var(--fh)}
.mdesc{line-height:1.35; min-height:2.7em}
.mstat{display:grid; grid-template-columns:78px 1fr 34px; gap:8px; align-items:center; font-size:12px}
.mstat span{color:var(--muted)} .mstat b{font-family:var(--fh); text-align:right}
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:4px}
.mgrid > div{background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:4px 7px; display:flex; flex-direction:column; min-width:0}
.mgrid span{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
.mgrid b{font-family:var(--fh); font-size:13px; display:flex; align-items:center; gap:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cdchip{display:inline-flex; align-items:center; gap:4px}
.mtags{display:flex; flex-wrap:wrap; gap:4px}
.mtags span{font-size:10.5px; padding:1px 7px; border-radius:10px; background:color-mix(in srgb, var(--mc) 12%, transparent); color:var(--text); border:1px solid color-mix(in srgb, var(--mc) 35%, transparent)}
.mfoot{display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:auto; padding-top:6px; border-top:1px dashed var(--line)}
.mfoot .price{font-family:var(--fh); font-weight:700; font-size:15px}
.slotpip{display:inline-flex; width:20px; height:20px; align-items:center; justify-content:center; border-radius:4px; font:700 10px var(--fh); color:var(--mc); border:1px solid var(--mc); background:color-mix(in srgb, var(--mc) 12%, transparent)}
/* facilities */
.facwrap{display:grid; grid-template-columns:minmax(0,1.75fr) minmax(260px,1fr); gap:12px; align-items:start}
.basesvg{width:100%; height:auto; display:block; border-radius:6px}
.basesvg .facb{cursor:pointer; transition:filter .15s}
.basesvg .facb:hover, .basesvg .facb:focus{filter:brightness(1.15); outline:none}
.basesvg .facb.sel{filter:drop-shadow(0 0 6px rgba(240,166,58,.55))}
.lvpips{display:inline-flex; gap:3px; vertical-align:middle} .lvpips i{width:12px; height:5px; border-radius:2px; background:var(--panel3)} .lvpips i.on{background:var(--amber)}
.facnow{display:grid; gap:6px} .facnow > div{background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:6px 9px; display:flex; flex-direction:column} .facnow span{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em} .facnow b{font-size:13px}
.faclist{display:flex; flex-direction:column; gap:5px} .faclist .card{padding:7px 10px}
@media (max-width: 1000px){ .facwrap{grid-template-columns:1fr} }

/* ===================== RESPONSIVE LAYOUT (narrow windows, phones in landscape) ===================== */
/* grid children default to min-width:auto, which lets wide content push the grid past the screen */
.grid2 > *, .grid3 > *, .grid4 > *, .pane2 > *, .facwrap > *, .draftgrid > *, .fagrid > *{min-width:0}
.hqgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.weekgrid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px}
.fagrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px}
.draftgrid{display:grid; grid-template-columns:repeat(var(--n,4),minmax(0,1fr)); gap:10px}
.leaguegrid{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.sugrid{grid-template-columns:minmax(260px,360px) minmax(0,1fr); align-items:start}
.sugrid.solo{grid-template-columns:minmax(0,1fr)}
.expgrid{grid-template-columns:minmax(0,2.3fr) minmax(250px,1fr); margin-top:12px; align-items:start}
.debgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); align-items:start}
.pdtop{align-items:start}
.pdbody{margin-top:12px}
.tscroll{overflow-x:auto}
.paintprev{width:300px; height:300px; border-radius:12px; border:1px solid var(--line)}
.exp-title{font-size:28px}
#rail{overflow-y:auto; scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.supilots .card{flex:none}

/* safe areas: in landscape the notch / camera cutout sits on the left or right edge */
#topbar{padding-left:calc(14px + env(safe-area-inset-left,0px)); padding-right:calc(14px + env(safe-area-inset-right,0px))}
#rail{width:calc(74px + env(safe-area-inset-left,0px)); padding-left:env(safe-area-inset-left,0px)}
.page{padding-right:calc(16px + env(safe-area-inset-right,0px))}
.fullpage{padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
#modal{padding-left:calc(12px + env(safe-area-inset-left,0px)); padding-right:calc(12px + env(safe-area-inset-right,0px))}

@media (max-width: 1100px){
  /* draft cards: portrait and rating on one line, name and chips get the full card width below */
  .draftcard > .row:first-child{flex-wrap:wrap; justify-content:space-between}
  .draftcard > .row:first-child > .grow{order:3; flex-basis:100%}
  .draftcard .portrait.md{width:56px; height:56px}
  .pdtop, .pdbody{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 900px){
  .hqgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hqgrid > :nth-child(3){grid-column:1 / -1}
  .pane2{grid-template-columns:minmax(200px,260px) minmax(0,1fr); gap:10px}
  .sugrid{grid-template-columns:minmax(220px,290px) minmax(0,1fr)}
  .leaguegrid{grid-template-columns:minmax(0,1.6fr) minmax(170px,1fr)}
  .debgrid{grid-template-columns:minmax(0,1fr)}
  .portrait.lg{width:88px; height:88px}
}
@media (max-width: 780px){
  .expgrid{grid-template-columns:minmax(0,1fr)}
  .draftgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opsgrid{grid-template-columns:minmax(0,1fr); gap:6px}
}

/* phones held sideways: short screens get a compact shell so content isn't buried under chrome */
@media (max-height: 540px) and (orientation: landscape){
  #topbar{height:40px; gap:10px}
  #topbar .gname{font-size:13px; max-width:150px}
  #topbar .stat{padding-left:8px}
  #topbar .stat b{font-size:13px}

  const w = CLASSES[cls].w;
  for (const k of STATS) {
    const bias = (w[k] - 1.5) * 4;

/* ================= GAME STATE ================= */

/* ---------- market & free agents ---------- */
function refreshMarket() {

  const keys = Object.keys(MODULES);
  for (let i = 0; i < 7; i++) { const k = R.pick(keys); const t = clamp(R.int(1, cap), 1, 5); G.market.push({ type: 'mod', k, t, id: uid(), price: Math.round(MODULES[k].price * (1 + 0.6 * (t - 1)) * priceMult() / 10) * 10 }); }
  for (let i = 0; i < 3; i++) {
    const ch = R.pick(CHASSIS); const base = { Light: 4200, Medium: 6200, Heavy: 8600, Assault: 11000 }[ch.wt];
    G.market.push({ type: 'mech', ch: ch.id, id: uid(), frame: makeFrame(R, ch.cls, ch.wt), price: Math.round(base * priceMult() / 10) * 10 });
  }
}
function refreshFreeAgents() {
  const n = 4 + G.facilities.scout;
  G.fa = [];

    const p = makePilot(R, { mean: tierBase(G.tier) - 4 + R.int(-8, 8), spread: 9 });
    p.ask = Math.round(p.wage * R.range(0.95, 1.25) / 10) * 10;

    if (R.chance(0.4)) { const m = makeMech(R, p.cls, { tier: clamp(1 + Math.floor(G.tier / 2), 1, 5) }); p.ownMech = m; p.fee += 2500; }

    p.potLo = clamp(p.pot - R.int(0, acc), p.ovr, 99); p.potHi = clamp(p.pot + R.int(0, acc), p.ovr, 99);

function signFreeAgent(p) {

/* ---------- repairs ---------- */
function startRepair(m) {

  if (d <= 0 && !m.wrecked) { m.repair = 0; return; }
  let cost = d * 1.2, days = Math.ceil(d / mx.total * 7);
  if (m.wrecked) { cost = mx.total * 3.4; days = 10; }
  const wf = 1 - 0.12 * (G.facilities.workshop - 1);
  days = Math.max(1, Math.round(days * wf * (G.history === 'mechanic' ? 0.7 : 1)));
  if (G.history === 'mechanic') cost *= 0.7;
  if (G.origin === 'town') cost *= 0.8;

  return cost;
}

  for (const x of m.modules) if (x) G.inventory.push({ ...x, id: uid() });

/* ---------- calendar ---------- */
function advanceDay() {
  const stops = [];
  G.day++;
  if (G.day > SEASON_DAYS) { endSeason(); stops.push('season'); return stops; }
  const away = new Set();
  for (const sq of ['A', 'B']) if (G.exp[sq]) for (const id of G.exp[sq].pilots) away.add(id);
  // pilots
  const medRate = 1 + 0.25 * (G.facilities.medbay - 1);
  for (const p of alivePilots()) {
    if (p.injury > 0) { p.injury = Math.max(0, p.injury - (away.has(p.id) ? 0.5 : medRate)); if (p.injury <= 0) { p.injuryNote = ''; log(`${p.call} is cleared to fly again.`, 'good'); } }
    if (!away.has(p.id)) p.fatigue = Math.max(0, p.fatigue - 5);
    p.away = away.has(p.id);
  }
  // repairs (only for mechs at base)
  for (const m of G.mechs) {
    const pilot = G.pilots.find(p => p.mechId === m.id);
    if (m.repair > 0 && !(pilot && away.has(pilot.id))) { m.repair--; if (m.repair <= 0) { m.dmg = { body: 0, arms: 0, legs: 0 }; m.wrecked = false; log(`${chassisOf(m).name} repairs complete.`); } }
  }
  // construction
  if (G.building) { G.building.days--; if (G.building.days <= 0) { G.facilities[G.building.k]++; log(`${FACILITIES[G.building.k].name} upgraded to level ${G.facilities[G.building.k]}.`, 'good'); G.building = null; } }
  // expeditions
  for (const sq of ['A', 'B']) {
    const e = G.exp[sq]; if (!e) continue;
    if (e.phase === 'travel' && G.day >= e.arrive) { e.phase = 'nodes'; e.pending = true; stops.push('node:' + sq); log(`Squad ${sq} reached the ${CONTRACT_TYPES[e.c.type].name} zone.`); }
    else if (e.phase === 'nodes' && !e.pending && G.day >= e.nextDay) { e.pending = true; stops.push('node:' + sq); }
    else if (e.phase === 'return' && G.day >= e.returnDay) { finishExpedition(sq); stops.push('return:' + sq); }
    else if (e.phase === 'nodes' && e.pending) stops.push('node:' + sq);
  }
  // weekly
  if ((G.day - 1) % 7 === 0) weekly();
  // monthly
  if (G.day % 28 === 0) monthly();
  // contracts
  chainExpiry();
  G.contracts = G.contracts.filter(c => c.expires >= G.day);
  while (G.contracts.length < 6) G.contracts.push(makeContract(R, G.tier));
  newsDaily();

  if (G.day === BRACKET_DAY) setupBracket();

function weekly() {

    const room = p.ovr < p.pot ? 1 : 0.25;

      if (pupil) { addXP(pupil, 45); p.fatigue += 4; }

  const fac = Object.values(G.facilities).reduce((s, l) => s + l * 60, 0);

  if (G.origin === 'arcology') income += 1200;

function launchExpedition(sq, c) {

}
function completeNode(e, n) {
  n.done = true; e.cur = n.id; e.nodesDone++; e.pending = false; e.nextDay = G.day + 1;
  if (n.layer === e.layers.length - 1) { e.phase = 'return'; e.returnDay = G.day + e.c.travel; e.success = true; log(`Squad ${e.sq} completed the objective and is heading home.`, 'good'); }
  autosave();
}
function extractExpedition(e) {
  e.phase = 'return'; e.returnDay = G.day + e.c.travel; e.success = false; e.extracted = true; e.pending = false;
  log(`Squad ${e.sq} extracted early.`, 'bad'); autosave();
}
function failExpedition(e) { e.phase = 'return'; e.returnDay = G.day + e.c.travel; e.success = false; e.failed = true; e.pending = false; log(`Squad ${e.sq} was driven off. The contract failed.`, 'bad'); }
function finishExpedition(sq) {
  const e = G.exp[sq];
  let pay = 0, rep = 0;
  if (e.success) { pay = e.c.pay; rep = RISK_REP[e.risk]; if (e.deaths === 0) pay = Math.round(pay * 1.1); }
  else if (e.extracted) { pay = Math.round(e.c.pay * (e.nodesDone / e.layers.length) * 0.5); rep = Math.round(RISK_REP[e.risk] * 0.25); }
  else { rep = -4; }
  let sal = e.salvage; if (G.origin === 'caravan') sal = Math.round(sal * 1.3);
  G.credits += pay; G.rep = Math.max(0, G.rep + rep); G.salvage += sal;
  for (const id of e.pilots.concat(e.reserves)) { const p = pilotById(id); if (p) p.away = false; }
  for (const id of e.pilots) { const p = pilotById(id); if (p && p.alive) { const m = mechOf(p); if (m && (m.dmg.body + m.dmg.arms + m.dmg.legs > 0 || m.wrecked)) startRepair(m); } }
  log(`Squad ${sq} returned: +${fmt(pay)} credits, ${rep >= 0 ? '+' : ''}${rep} rep, +${sal} salvage.`, e.success ? 'good' : 'bad');
  G.exp[sq] = null;
  G.lastReturn = { sq, pay, rep, sal, success: e.success };
  if (e.c.chain) chainResult(e);
}
function nodeSalvage(e) { const v = R.int(6, 14) + (e.c.type === 'salvage' ? 8 : 0); e.salvage += v; return v; }
function nodeRest(e) {
  for (const id of e.pilots) {
    const p = pilotById(id); if (!p || !p.alive) continue;
    const m = mechOf(p); if (!m) continue;
    for (const k of ['body', 'arms', 'legs']) m.dmg[k] = Math.round(m.dmg[k] * 0.75);
    p.fatigue = Math.max(0, p.fatigue - 25); p.morale = Math.min(100, p.morale + 4);
  }
}

/* ---------- battle results ---------- */
function addXP(p, xp) {
  if (G.history === 'pilot') xp *= 1.15;
  p.xp += Math.round(xp);
  while (p.xp >= p.level * 80) { p.xp -= p.level * 80; p.level++; G.perkQ.push(p.id); }
}
function applyBattle(res, ctx) {
  // ctx: {exp, sanctioned, deployed:[pilot ids]}
  const out = { lines: [], deaths: [], injuries: [], levelups: [] };
  G.stats.battles++; if (res.win) G.stats.wins++;
  const deadNames = [];
  for (const u of res.units) {
    const p = pilotById(u.pilotId), m = mechById(u.mechId);
    if (!p || !m) continue;
    m.dmg = { body: Math.round(u.max.body - u.hp.body), arms: Math.round(u.max.arms - u.hp.arms), legs: Math.round(u.max.legs - u.hp.legs) };
    if (!u.alive) { m.wrecked = true; m.dmg = { body: u.max.body, arms: u.max.arms, legs: u.max.legs }; }
    p.battles++; p.kills += u.st.kills;
    m.affinity = Math.min(10, (m.affinity || 0) + 1);
    const lvl0 = p.level;
    addXP(p, 28 + u.st.kills * 12 + u.st.dealt / 25 + u.st.healed / 20 + (res.win ? 20 : 0));
    if (p.level > lvl0) out.levelups.push(p);
    p.fatigue = Math.min(100, p.fatigue + Math.round(20 - p.stats.endurance / 10));
    p.morale = clamp(p.morale + (res.win ? 6 : -8) + (p.arch === 'Hotblood' && u.st.kills ? 3 : 0) + (p.arch === 'Prodigy' && !res.win ? -4 : 0), 0, 100);
    if (u.fate === 'kia') {
      p.alive = false; p.diedOn = `S${G.season} D${G.day}`; p.lastWords = R.pick(LAST_WORDS); p.mechId = null;
      G.memorial.push({ name: pilotName(p), when: p.diedOn, battles: p.battles, kills: p.kills });
      out.deaths.push(p); deadNames.push(p.call); G.stats.kia++;
      if (ctx.exp) ctx.exp.deaths++;
    } else if (u.fate === 'minor') { p.injury = R.int(3, 7); p.injuryNote = 'Minor injury'; out.injuries.push(p); }
    else if (u.fate === 'major') {
      p.injury = R.int(14, 26); p.injuryNote = 'Major injury'; out.injuries.push(p);
      if (R.chance(0.35 / (1 + 0.3 * (G.facilities.medbay - 1)))) { const k = R.pick(STATS); const loss = R.int(2, 5); p.stats[k] = Math.max(15, p.stats[k] - loss); p.ovr = ovrOf(p); p.injuryNote += ` (−${loss} ${STAT_NAMES[k]})`; }
    }
  }
  if (deadNames.length) for (const p of alivePilots()) {
    const hit = p.arch === 'Cheerful' ? 22 : p.arch === 'Haunted' ? 18 : p.arch === 'Stoic' ? 6 : 12;
    p.morale = clamp(p.morale - hit * deadNames.length, 0, 100);
  }
  newsBattle(res, out, ctx);
  return out;
}

/* ---------- league ---------- */
function standings() {
  const rows = G.rivals.map(r => ({ name: r.name, rep: r.rep, banner: r.banner, me: false, str: r.str, id: r.id }));
  rows.push({ name: G.name, rep: G.rep, banner: G.banner, me: true });
  rows.sort((a, b) => b.rep - a.rep);
  return rows;
}
function setupBracket() {
  const st = standings(), pos = st.findIndex(r => r.me);
  const used = new Set(G.rivals.map(r => r.name).concat([G.name]));
  if (pos <= 1) {
    if (G.tier === TIERS.length - 1) {
      const other = st[pos === 0 ? 1 : 0]; const r = G.rivals.find(x => x.id === other.id);
      G.series = { kind: 'final', opp: { ...r, str: r.str + 2 }, wins: 0, losses: 0, done: false };
      log(`You qualified for the ${TIERS[G.tier]} championship final against ${r.name}!`, 'good');
    } else {
      const opp = makeRival(R, G.tier + 1, used); opp.str = tierBase(G.tier + 1) - 2;
      G.series = { kind: 'promotion', opp, wins: 0, losses: 0, done: false };
      log(`Promotion series! You face ${opp.name} of the ${TIERS[G.tier + 1]} on day ${SERIES_DAY}.`, 'good');
    }
  } else if (pos >= st.length - 2 && (G.tier > 0 || G.season > 1)) {
    const opp = makeRival(R, Math.max(0, G.tier - 1), used); opp.str = tierBase(Math.max(0, G.tier - 1)) + 3;
    G.series = { kind: 'relegation', opp, wins: 0, losses: 0, done: false };
    log(`Relegation series: you must beat ${opp.name} on day ${SERIES_DAY} to keep your place.`, 'bad');
  } else { G.series = null; log(`The ${TIERS[G.tier]} bracket is set. ${G.name} finished ${pos + 1}${['st', 'nd', 'rd'][pos] || 'th'} and holds its tier.`); }
}
function seriesResult(win) {
  const s = G.series;
  if (win) s.wins++; else s.losses++;
  if (s.wins >= 2 || s.losses >= 2) {
    s.done = true; s.won = s.wins >= 2;
    if (s.kind === 'promotion' && s.won) { s.outcome = `Promoted to the ${TIERS[G.tier + 1]}!`; G.pendingTier = G.tier + 1; }
    else if (s.kind === 'promotion') s.outcome = 'Promotion denied. You stay put for another season.';
    else if (s.kind === 'relegation' && !s.won) {
      if (G.tier === 0) { G.over = { why: 'Disbanded', txt: 'Relegated out of the Salvage League. The Concordat pulled your license.' }; s.outcome = 'Relegated out of the league.'; }
      else { G.pendingTier = G.tier - 1; s.outcome = `Relegated to the ${TIERS[G.tier - 1]}.`; }
    } else if (s.kind === 'relegation') s.outcome = 'You survived relegation.';
    else if (s.kind === 'final') { s.outcome = s.won ? 'APEX CHAMPIONS!' : 'Runners-up in the Apex Circuit.'; if (s.won) G.champion = true; }
    log(s.outcome, s.won ? 'good' : 'bad');
    news(`${G.name} vs ${s.opp.name}: ${s.outcome}`, s.won ? 'good' : 'bad');
    G.rep += s.won ? 15 : 0;
  }
}
function endSeason() {
  G.seasonsPlayed++;
  const tier = G.pendingTier ?? G.tier; G.pendingTier = undefined;
  const moved = tier !== G.tier; G.tier = tier;
  G.season++; G.day = 1; G.rep = 0; G.series = null;
  const used = new Set();
  G.rivals = []; for (let i = 0; i < 7; i++) G.rivals.push(makeRival(R, G.tier, used));
  const leaving = [];
  for (const p of alivePilots()) {
    p.age++;
    if (p.age >= 30) for (const k of ['reflex', 'endurance']) p.stats[k] = Math.max(15, p.stats[k] - R.int(0, 2));
    p.ovr = ovrOf(p);
    p.contract--;
    if (p.contract <= 0) {
      if (p.morale < 30 || (p.age > 37 && R.chance(0.5))) { leaving.push(p); continue; }
      p.contract = R.int(1, 3); p.wage = Math.round(Math.max(p.wage, (p.ovr * 9 + Math.max(0, p.ovr - 55) * 14) / 10 * 10) * 1.05 / 10) * 10;
      log(`${p.call} renewed for ${p.contract} season${p.contract > 1 ? 's' : ''} at ${fmt(p.wage)}/month.`);
    }
  }
  for (const p of leaving) { releasePilot(p, true); log(`${pilotName(p)} left the guild when their contract ran out.`, 'bad'); }
  G.contracts = G.contracts.filter(c => c.chain); for (const c of G.contracts) c.expires = 14; // story jobs carry over
  while (G.contracts.length < 6) G.contracts.push(makeContract(R, G.tier));
  G.trend = null; G.newsLead = null; G.newsPos = null;
  news(`Season ${G.season} opens: ${G.rivals.length + 1} guilds register for the ${TIERS[G.tier]}`);
  log(`Season ${G.season} begins in the ${TIERS[G.tier]}${moved ? ' (new tier)' : ''}.`, 'good');
}
function releasePilot(p, free) {
  if (!free) { const fee = Math.round(p.wage * p.contract * 0.5); G.credits -= fee; log(`Released ${p.call} (paid ${fmt(fee)} to end the contract).`); }
  G.pilots = G.pilots.filter(x => x !== p);
}

function applyEvent(ev, ch) {
  const f = ev.choices[ch].fx;
  if (f.cr) G.credits += f.cr;
  if (f.rep) G.rep = Math.max(0, G.rep + f.rep);
  if (f.sal) G.salvage = Math.max(0, G.salvage + f.sal);
  if (f.morale) { const p = pilotById(f.morale[0]); if (p) p.morale = clamp(p.morale + f.morale[1], 0, 100); }
  if (f.moraleAll) for (const p of alivePilots()) p.morale = clamp(p.morale + f.moraleAll, 0, 100);
  if (f.moraleIdeal) for (const p of alivePilots()) if (p.arch === 'Idealist') p.morale = clamp(p.morale + f.moraleIdeal, 0, 100);
  if (f.leave) { const p = pilotById(f.leave); if (p) { p.injury = Math.max(p.injury, 3); p.injuryNote = 'On leave'; p.fatigue = 0; } }
  if (f.injure) { const p = pilotById(f.injure[0]); if (p) { p.injury = Math.max(p.injury, f.injure[1]); p.injuryNote = 'Minor injury'; } }
  if (f.xp) { const p = pilotById(f.xp[0]); if (p) addXP(p, f.xp[1]); }
  if (f.fatigue) { const p = pilotById(f.fatigue[0]); if (p) p.fatigue = clamp(p.fatigue + f.fatigue[1], 0, 100); }
  if (f.morale2) { const p = pilotById(f.morale2[0]); if (p) p.morale = clamp(p.morale + f.morale2[1], 0, 100); }
  if (f.xp2) { const p = pilotById(f.xp2[0]); if (p) addXP(p, f.xp2[1]); }
  if (f.fatigue2) { const p = pilotById(f.fatigue2[0]); if (p) p.fatigue = clamp(p.fatigue + f.fatigue2[1], 0, 100); }
  if (f.fatigueAll) for (const p of alivePilots()) if (!p.away) p.fatigue = clamp(p.fatigue + f.fatigueAll, 0, 100);
  if (f.xpAll) for (const p of alivePilots()) if (!p.away) addXP(p, f.xpAll);
  if (f.healAll) for (const p of alivePilots()) if (p.injury > 0 && !p.away) p.injury = Math.max(0, p.injury - f.healAll);
  if (f.heal) { const p = pilotById(f.heal[0]); if (p) { p.injury = Math.max(0, p.injury - f.heal[1]); if (R.chance(0.15)) { p.injury += 3; toast(`${p.call} pushed too hard and is back in the medbay.`); } } }
  if (f.bounty) { // lone raider: the pilot's overall decides how it goes
    const p = pilotById(f.bounty); if (p) { const win = R.chance(clamp(0.45 + (p.ovr - tierBase(G.tier)) / 50, 0.25, 0.9));
      if (win) { G.credits += 1200; addXP(p, 50); p.morale = clamp(p.morale + 6, 0, 100); toast(`${p.call} ran the raider off: +1,200 cr`); log(`${p.call} collected the sheriff's bounty.`, 'good'); }
      else { p.injury = Math.max(p.injury, 4); p.injuryNote = 'Bounty gone wrong'; p.morale = clamp(p.morale - 6, 0, 100); toast(`${p.call} came back hurt.`); log(`${p.call} was hurt chasing the sheriff's bounty.`, 'bad'); } } }
  if (f.duel) { // sim duel: the pilot's overall decides the odds
    const p = pilotById(f.duel); if (p) { const win = R.chance(clamp(0.35 + (p.ovr - tierBase(G.tier)) / 60, 0.2, 0.85));
      if (win) { G.rep += 5; if (f.prize) G.credits += f.prize; p.morale = clamp(p.morale + 8, 0, 100); addXP(p, 40); toast(`${p.call} won!${f.prize ? ` +${fmt(f.prize)} cr,` : ''} +5 rep`); log(`${p.call} won a public sim duel.`, 'good'); }
      else { p.morale = clamp(p.morale - 6, 0, 100); addXP(p, 15); toast(`${p.call} lost the duel.`); log(`${p.call} lost a public sim duel.`, 'bad'); } } }
  if (f.item) { const k = R.pick(Object.keys(MODULES)); G.inventory.push({ k, t: clamp(G.facilities.workshop, 1, 3), id: uid() }); log(f.free ? `Recovered a ${MODULES[k].name} from the cache.` : `Bought a ${MODULES[k].name} from the scrapper.`); }
  if (f.chainStart) startChain(f.chainStart);
  if (f.chainDecline) { G.chainLast = absDay(); log(`Turned down ${PATRONS[CHAINS[f.chainDecline].patron].name}.`); }
  if (f.chainPick !== undefined) chainPick(f.chainPick);
  if (f.chainQuit) chainEnd(false, 'You walked away from the job.');
  if (f.chainClose) chainClose(f.chainClose);
  log(`${ev.title}: ${ev.choices[ch].t}.`);

/* ================= NEWS FEED ================= */
// headlines persist in G.news (newest first). Picks use a day-seeded RNG so the world RNG sequence is untouched.
function absDay() { return (G.season - 1) * SEASON_DAYS + G.day; }
function news(txt, kind = '') { if (!G) return; if (!G.news) G.news = []; G.news.unshift({ d: G.day, s: G.season, txt, kind }); if (G.news.length > 40) G.news.length = 40; }

const TREND_NEWS = {

  ghost: ['Ghost Frame signal traffic spiking over {r}', 'Survey drones going dark one by one near {r}', 'Concordat warns of unregistered frames moving through {r}'],
  hollow: ['Seismic tremors under {r}: rift-watchers fear a new breach', 'Hollow spoor found in the water tables near {r}', 'Livestock vanishing around {r}; locals blame the Hollow'],
};

const FLAVOR_NEWS = [
  'Concordat auditors fine three Salvage League guilds for undeclared salvage', 'Coolant prices climb again after a refinery fire on the coast', 'Rift-watch stations report a quiet week. Nobody believes it.',
  'Settlement council elections postponed as militias stay on alert', 'Feed ratings for sanctioned matches hit a season high', 'A retired Apex pilot opens a sim-pod school; waiting list already full',
  'Scrap haulers strike over salvage rates; market stock runs thin', 'Meridian Spire announces record quarter, declines to explain where', 'Brass Wheel Caravan spotted turning north for the first time in years',
  'Carrier Command extends drop windows for registered guilds', 'Old militia bunker found under Teller Heights. Sealed. Staying sealed.', 'Concordat registry passes four hundred active guilds',
];
function newsDaily() {
  const nr = newsRng('day');
  if (G.trend && G.day > G.trend.until) G.trend = null;
  if (!G.trend && G.day >= 3 && G.day < SEASON_DAYS - 6 && nr() < 0.17) {
    const fac = nr.pick(['raiders', 'ghost', 'hollow', 'raiders']);
    const biome = fac === 'hollow' ? nr.pick(['hive', 'hive', 'waste', 'ice']) : nr.pick(['waste', 'city', 'ice']);
    const region = nr.pick(REGIONS[biome]);
    G.trend = { fac, biome, region, from: G.day + 1 + nr.int(0, 1), until: G.day + 9 };
    news(fillNews(nr.pick(TREND_NEWS[fac]), { r: region }), 'warn');
  } else if (G.trend && !G.trend.hit && G.day >= G.trend.from) {

    if (free && G.contracts.length >= 6) G.contracts.splice(G.contracts.indexOf(free), 1);
    G.contracts.unshift(c);
    news(`Concordat posts ${CONTRACT_TYPES[c.type].name.toLowerCase()} work in ${T.region}`);
  } else if (nr() < 0.2) { const seen = new Set((G.news || []).slice(0, 20).map(n => n.txt)), pool = FLAVOR_NEWS.filter(t => !seen.has(t)); if (pool.length) news(nr.pick(pool)); }
}
function newsWeekly(gains) {
  if (!G.rivals.length) return;
  const nr = newsRng('wk'), rg = () => nr.pick(REGIONS[nr.pick(Object.keys(REGIONS))]);
  let bi = 0, li = 0; gains.forEach((g, i) => { if (g > gains[bi]) bi = i; if (g < gains[li]) li = i; });
  news(fillNews(nr.pick(RIVAL_WIN_NEWS), { g: G.rivals[bi].name, r: rg(), n: gains[bi], c: nr.pick(['extermination', 'salvage', 'defense', 'bounty', 'rift-closure']) }));
  if (li !== bi && nr() < 0.5) news(fillNews(nr.pick(RIVAL_LOSS_NEWS), { g: G.rivals[li].name, r: rg() }));
  const st = standings(), pos = st.findIndex(r => r.me), lead = st[0].name;
  if (G.newsLead && lead !== G.newsLead) news(`${lead} now lead the ${TIERS[G.tier]} standings`, st[0].me ? 'good' : '');
  else if (G.newsPos != null && pos !== G.newsPos) news(pos < G.newsPos ? `${G.name} climb to ${ordinal(pos + 1)} in the ${TIERS[G.tier]}` : `${G.name} slip to ${ordinal(pos + 1)} in the ${TIERS[G.tier]}`, pos < G.newsPos ? 'good' : 'bad');
  G.newsLead = lead; G.newsPos = pos;

function newsBattle(res, out, ctx) { // your pilots' deeds
  const where = ctx && ctx.exp ? ` near ${regionOf(ctx.exp.c)}` : ctx && ctx.sanctioned ? ' on the sanctioned field' : '';
  for (const p of out.deaths) news(`${G.name} mourn ${pilotName(p)}, killed in action${where}`, 'bad');

    const p = pilotById(u.pilotId); if (!p || !p.alive) continue;
    const k1 = p.kills, k0 = k1 - u.st.kills, T = [5, 10, 25, 50, 100].find(t => k0 < t && k1 >= t);
    if (T) news(T === 5 ? `${p.call} of ${G.name} makes ace with a fifth confirmed kill` : `${p.call} of ${G.name} logs confirmed kill number ${T}`, 'good');

  }
}
function tickerHTML() {
  const items = (G.news || []).slice(0, 12);
  if (!items.length) return '';
  const one = items.map(n => `<span class="tk ${n.kind}"><b>D${n.d}</b>${esc(n.txt)}</span><i>//</i>`).join('');
  const dur = Math.max(28, items.reduce((s, n) => s + n.txt.length + 8, 0) * 0.17).toFixed(0);
  return `<button class="ticker" data-act="newsLog" title="Open the news feed"><span class="tlab">FEED</span><span class="tmask"><span class="trun" style="animation-duration:${dur}s">${one}${one}</span></span></button>`;
}

/* ---------- day controls: Next day / Sim to <next scheduled thing> ---------- */
// everything on the calendar, soonest first (random events are not on it: they can interrupt a sim)
function upcomingEvents() {
  const L = [], d0 = G.day;
  for (const sq of ['A', 'B']) {
    const e = G.exp[sq]; if (!e) continue;
    if (e.phase === 'travel') L.push({ d: e.arrive, t: `Squad ${sq} arrival` });
    else if (e.phase === 'nodes' && !e.pending) L.push({ d: e.nextDay, t: `Squad ${sq} exploration` });
    else if (e.phase === 'return') L.push({ d: e.returnDay, t: `Squad ${sq} return` });
  }
  if (G.building) L.push({ d: d0 + G.building.days, t: `${FACILITIES[G.building.k].name} upgrade` });
  const rep = G.mechs.filter(m => m.repair > 0 && !m.scrapped).map(m => m.repair); if (rep.length) L.push({ d: d0 + Math.min(...rep), t: 'Repairs done' });
  const inj = alivePilots().filter(p => p.injury > 0 && !p.away).map(p => Math.ceil(p.injury / (1 + 0.25 * (G.facilities.medbay - 1)))); if (inj.length) L.push({ d: d0 + Math.min(...inj), t: 'Pilot recovered' });
  L.push({ d: d0 + (7 - ((d0 - 1) % 7)), t: 'Training week' });
  L.push({ d: (Math.floor(d0 / 28) + 1) * 28, t: 'Payday' });
  if (d0 < BRACKET_DAY) L.push({ d: BRACKET_DAY, t: 'Bracket locks' });
  if (d0 < SERIES_DAY && (!G.series || !G.series.done)) L.push({ d: SERIES_DAY, t: 'League match' });
  L.push({ d: SEASON_DAYS + 1, t: 'Season end' });
  return L.filter(x => x.d > d0).sort((a, b) => a.d - b.d);
}
function nextUpcoming() { return upcomingEvents()[0] || { d: G.day + 1, t: 'next day' }; }
// something that needs a decision before time can move on
function blockingLabel() {
  if (G.events.length) return 'Resolve event';
  if (G.perkQ.length) return 'Choose perk';
  for (const sq of ['A', 'B']) if (G.exp[sq] && G.exp[sq].pending) return `Orders: Squad ${sq}`;
  if (G.series && !G.series.done && G.day >= SERIES_DAY) return 'Fight series';
  return null;
}
function continueLabel() {
  if (G.events.length) return 'Resolve event';
  if (G.perkQ.length) return 'Choose perk';
  for (const sq of ['A', 'B']) if (G.exp[sq] && G.exp[sq].pending) return `Orders: Squad ${sq}`;
  if (G.series && !G.series.done && G.day >= SERIES_DAY) return 'Fight series';
  return 'Continue';
}
// advance one day at a time until the target day, stopping early if something needs attention
function runDays(untilDay) {
  let all = []; const start = G.day;
  for (let i = 0; i < 120 && G.day < untilDay; i++) { const s = advanceDay(); all = all.concat(s); if (s.length) break; }
  autosave();
  return { stops: all, days: G.day - start };
}
function resolveBlocking() {
  if (G.events.length) { showEvent(G.events[0]); return true; }
  if (G.perkQ.length) { showPerkChoice(); return true; }
  for (const sq of ['A', 'B']) if (G.exp[sq] && G.exp[sq].pending) { openExpedition(sq); return true; }
  if (G.series && !G.series.done && G.day >= SERIES_DAY) { UI.tab = 'league'; render(); toast('Pick a squad for the series round.'); return true; }
  return false;
}
$('#nextday').addEventListener('click', () => { if (!G || G.over || resolveBlocking()) return; dayStep(G.day + 1, null); });
$('#continue').addEventListener('click', () => { if (!G || G.over || resolveBlocking()) return; const nx = nextUpcoming(); dayStep(nx.d, nx); });
function dayStep(untilDay, target) {
  const { stops, days } = runDays(untilDay);
  render();
  if (target && !stops.length && G.day >= target.d) toast(`Day ${G.day}: ${target.t}${days > 1 ? ` (${days} days simmed)` : ''}`);
  else if (target && stops.length && G.day < target.d) toast(`Interrupted on day ${G.day}`);
  if (G.over) { renderGameOver(); return; }
  if (stops.includes('season')) { modal(`<h2>Season ${G.season} begins</h2><p>You compete in the <b>${TIERS[G.tier]}</b>. Rep has been reset and a new set of rivals has registered.</p><div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="closeModal">Continue</button></div>`); return; }
  const ret = stops.find(s => s.startsWith('return:'));
  if (ret && G.lastReturn) { const r = G.lastReturn; toast(`Squad ${r.sq} is home: +${fmt(r.pay)} credits, +${r.sal} salvage.`); }
  if (G.events.length) { showEvent(G.events[0]); return; }
  const node = stops.find(s => s.startsWith('node:'));
  if (node) { openExpedition(node.slice(5)); return; }
  if (stops.includes('series')) { UI.tab = 'league'; render(); toast('Series day! Pick a squad on the League screen.'); }
}

function startTitleDemo() {

    const r = cvx.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cvx.width !== Math.round(r.width * dpr)) { cvx.width = Math.round(r.width * dpr); cvx.height = Math.round(r.height * dpr); }
    const B = DEMO.B;

    updateFX(B, B.fx, dt * B.fx.timeScale); barkScan(B, B.fx, dt);
    drawBattle(B, B.fx, r.width, r.height, dpr);

}

function leagueInfo() {

  if (s && !s.done) {

    const kind = s.kind === 'promotion' ? 'Promotion series' : s.kind === 'relegation' ? 'Relegation series' : 'Championship final';
    return { days: left, day: SERIES_DAY, title: left ? `${kind} in ${left} day${left === 1 ? '' : 's'}` : `${kind}: match day is today`, opp: s.opp, kind: s.kind, note: s.kind === 'relegation' ? 'Lose and you drop a tier.' : s.kind === 'promotion' ? `Win to move up to the ${TIERS[G.tier + 1]}.` : 'Win to become champions.', ready: left === 0 };
  }
  if (G.day < BRACKET_DAY) {
    const left = SERIES_DAY - G.day, cut = Math.max(0, st[1].rep - G.rep + 1), danger = pos >= n - 2 && (G.tier > 0 || G.season > 1);
    const zone = pos <= 1 ? (G.tier === TIERS.length - 1 ? 'final' : 'promotion') : danger ? 'relegation' : 'safe';
    const note = zone === 'promotion' ? `You hold a promotion spot. The bracket locks on day ${BRACKET_DAY}.` : zone === 'final' ? `You hold a spot in the championship final. The bracket locks on day ${BRACKET_DAY}.`

    return { days: left, day: SERIES_DAY, title: `League match day in ${left} day${left === 1 ? '' : 's'}`, zone, note, pos, n, bracketIn: BRACKET_DAY - G.day };
  }
  return { days: toNextSeason, day: SERIES_DAY, nextSeason: true, title: `Next league match day in ${toNextSeason} days`, note: s && s.done ? `This season's series is over: ${esc(s.outcome || '')}. Next season's match day is day ${SERIES_DAY}.` : `No series for ${esc(G.name)} this season. Season ends on day ${SEASON_DAYS}; next match day is day ${SERIES_DAY} of season ${G.season + 1}.` };

    else if (T.kind === 'melee') { shot = dmg = T.dmg * tm; cycle = T.reload; }

    else if (T.kind === 'mortar') { shot = T.dmg * tm; dmg = shot * T.salvo; cycle = T.reload; }

      if (T.fn === 'heal') S.tags.push(`Repairs ${Math.round(shot)} HP/s per drone`, 'Seeks the most damaged ally');

function perkOptions(p) {
  if ((p.level === 5 || p.level === 10) && SPECS[p.cls]) { const sp = SPECS[p.cls].filter(s => !p.perks.includes(s.id)); if (sp.length) return sp; }
  const pool = PERKS.filter(k => k.cls.includes(p.cls) && !p.perks.includes(k.id) && (!k.req || k.req(p)));
  const combo = pool.find(k => k.id === 'combo'); // melee-heavy pilots always get the chance at Combo Master
  const out = []; const r = RNG(hashStr(p.id + p.level));
  while (out.length < 3 && pool.length) out.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  if (combo && !out.includes(combo)) out[out.length - 1] = combo;
  return out;
}

  modal(`<div class="row" style="gap:14px">${portrait(p, 'md', 'happy')}<div><h2>${esc(p.call)} reached level ${p.level}</h2><p class="small muted">${spec ? 'Choose a specialization. This defines their role for the rest of their career.' : 'Choose a perk.'}</p></div></div>

function renderSetup2() {

  const grid = [];

    const f = c * 3 + r; const occ = S.pilots.find(q => q.form === f);
    grid.push(`<button class="fcell ${occ && occ.id === S.sel ? 'sel' : ''}" data-act="fcell" data-f="${f}">${occ ? `<div class="fm">${portrait(occ, '', 'neutral').replace('class="portrait ', 'style="width:28px;height:28px" class="portrait ')}<span>${esc(occ.call)}</span></div>` : (r === 1 ? ['Back', 'Mid', 'Front'][c] : '')}</button>`);
  }
  const slots = slotsFor(p);
  const rules = p.rules;

    const p = pilotById(u.pilotId); if (!p) return '';
    const kia = u.fate === 'kia', isMvp = hasMvp && u === mvp, close = closeU.includes(u), ej = !u.alive && !kia, fallen = [...dead].some(id => id !== p.id);
    const sit = fallen ? 'fallen' : ej ? 'ejected' : close ? 'close' : isMvp ? 'mvp' : res.win ? 'win' : 'loss';
    const fragile = p.arch === 'Haunted' || p.arch === 'Cheerful' || p.arch === 'Prodigy';
    const expr = kia ? 'neutral' : sit === 'fallen' ? (p.arch === 'Stoic' || p.arch === 'Veteran' ? 'shaken' : 'broken') : sit === 'ejected' || sit === 'close' ? 'shaken'
      : sit === 'mvp' ? (p.arch === 'Hotblood' || p.arch === 'Haunted' || p.arch === 'Stoic' ? 'fierce' : 'happy') : sit === 'win' ? (u.st.kills >= 2 && p.arch === 'Hotblood' ? 'fierce' : 'happy') : fragile ? 'broken' : 'shaken';
    const L = (DEBRIEF_LINES[p.arch] || DEBRIEF_LINES.Stoic)[sit];
    const quote = kia ? (p.lastWords || '...') : L[hashStr(p.id + ':' + Math.round(res.t * 10)) % L.length];
    return `<div class="comm ${kia ? 'kia' : ''}">${portrait(p, 'md', expr)}<div class="cm"><div class="row" style="gap:4px; flex-wrap:wrap"><b>${esc(p.call)}</b>${isMvp ? '<span class="chip mvp">MVP</span>' : ''}${close ? `<span class="chip close">Close call · ${Math.max(1, Math.round(u.minHp * 100))}%</span>` : ''}${kia ? '<span class="chip inj">KIA</span>' : ej ? '<span class="chip inj">Ejected</span>' : ''}</div><div class="tiny muted">${p.arch} · ${u.st.kills} kill${u.st.kills === 1 ? '' : 's'} · ${Math.round(u.st.dealt)} dmg${u.st.healed >= 1 ? ` · ${Math.round(u.st.healed)} repaired` : ''}</div><q>${esc(quote)}</q></div></div>`;
  }).join('');
  const wx = res.wx && res.wx !== 'clear' && WEATHER[res.wx] ? ` · fought in ${WEATHER[res.wx].name.toLowerCase()}` : '';
  return `<div class="panel" style="margin-bottom:10px"><div class="row wrap" style="justify-content:space-between; gap:6px"><h3>Squad comms</h3><span class="small muted">${hasMvp ? `MVP <b style="color:var(--amber)">${esc(mvp.label)}</b> · ` : ''}${closeU.length ? `Close calls: ${closeU.map(u => esc(u.label)).join(', ')}` : 'No close calls'}${wx}</span></div><div class="comms">${cards}</div></div>`;
}
function fateChip(u) {
  if (u.fate === 'kia') return '<span class="chip inj">KIA</span>';
  if (!u.alive) return `<span class="chip inj">Ejected${u.fate === 'major' ? ' · major injury' : u.fate === 'minor' ? ' · minor injury' : ''}</span>`;
  return '<span class="chip" style="color:var(--good)">Operational</span>';
}
function renderDebrief() {
  const { res, out, sel } = UI.deb;
  const su = res.units.find(u => u.pilotId === sel) || res.units[0];
  const sp = su && pilotById(su.pilotId);
  const maxC = Math.max(1, ...(su ? su.ruleCounts : [1]));
  const rules = sp ? sp.rules.slice(0, slotsFor(sp)) : [];
  const ruleRep = rules.map((r, i) => { const C = CONDS[r.c]; const cp = C.p === 'pct' ? ` ${r.p}%` : C.p === 'cls' ? ` ${CLASSES[r.p].short}` : C.p === 'n' ? ` ${r.p}` : ''; const n = su.ruleCounts[i] || 0; return `<div class="statrow" style="grid-template-columns:1.6fr 1fr 34px"><span class="small ${n ? '' : 'muted'}">R${i + 1} ${C.name}${cp} → ${ACTS[r.a]}</span>${bar(n / maxC)}<span class="small">${n}</span></div>`; }).join('');
  const never = rules.map((r, i) => (su.ruleCounts[i] || 0) === 0 ? i + 1 : null).filter(Boolean);
  showFull(`<div class="setup" style="max-width:1100px; padding-top:14px">
  <div class="row" style="justify-content:space-between"><h1 class="${res.win ? 'good' : 'bad'}">${res.win ? 'Victory' : res.timeout ? 'Stalemate' : 'Defeat'}</h1><button class="btn primary" data-act="debNext">Continue</button></div>
  <p class="muted">${res.kills} hostiles destroyed in ${Math.round(res.t)} seconds.</p>
  ${debriefComms(res, out)}
  <div class="grid2 debgrid"><div class="panel"><div class="tscroll"><table class="t"><tr><th>Pilot</th><th>Damage</th><th>Taken</th><th>Kills</th><th>Repaired</th><th title="Missiles dash-dodged / shot down">Dodge / PD</th><th>Status</th></tr>
  ${res.units.map(u => { const p = pilotById(u.pilotId); return `<tr class="${u.pilotId === sel ? 'me' : ''}" data-act="debSel" data-id="${u.pilotId}" style="cursor:pointer"><td><div class="row" style="gap:6px">${p ? portrait(p, '', u.fate === 'kia' ? 'neutral' : res.win ? 'happy' : 'shaken') : ''}<b>${esc(u.label)}</b>${u.sigUsed ? ' <span class="chip tiny" style="color:var(--cyan)">Signature</span>' : ''}</div></td><td>${Math.round(u.st.dealt)}</td><td>${Math.round(u.st.taken)}</td><td>${u.st.kills}</td><td>${Math.round(u.st.healed)}</td><td>${u.st.dodges || 0} / ${u.st.intercepts || 0}</td><td>${fateChip(u)}</td></tr>`; }).join('')}</table></div>
  ${out.deaths.map(p => `<div class="panel" style="margin-top:10px; border-color:var(--danger)"><div class="row">${portrait(p, 'md', 'neutral')}<div><h3>${esc(pilotName(p))} was killed in action</h3><p class="small" style="margin:4px 0; font-style:italic">“${esc(p.lastWords)}”</p><div class="tiny muted">${p.battles} battles · ${p.kills} kills. Their name goes on the memorial wall.</div></div></div></div>`).join('')}
  ${out.injuries.length ? `<p class="small warnc" style="margin-top:8px">${out.injuries.map(p => `${esc(p.call)}: ${esc(p.injuryNote)}, ${Math.ceil(p.injury)} days`).join(' · ')}</p>` : ''}
  ${out.levelups.length ? `<p class="small good">${out.levelups.map(p => `${esc(p.call)} reached level ${p.level}`).join(' · ')}</p>` : ''}</div>
  <div class="panel"><h3>${esc(su ? su.label : '')}: rule report</h3><p class="small muted" style="margin:0 0 8px">How often each command priority fired.</p>${ruleRep}
  ${never.length ? `<p class="small warnc">Rule${never.length > 1 ? 's' : ''} ${never.join(', ')} never fired. ${never.length && rules[never[0] - 1] && rules[never[0] - 1].c === 'always' ? '' : 'Check whether a rule above always wins first, or the condition never came up.'}</p>` : '<p class="small good">Every rule fired at least once.</p>'}</div></div></div>`);
}
ACT.debSel = d => { UI.deb.sel = d.id; renderDebrief(); };
ACT.debNext = () => {
  const next = UI.deb.next; UI.deb = null; UI.full = null;
  next();
  if (G && G.perkQ.length && !UI.full) showPerkChoice();
};

/* ================= INIT ================= */
(function init() {
  try { const t = localStorage.getItem('sc_theme'); if (t) { UI.theme = t; if (t !== 'auto') document.documentElement.setAttribute('data-theme', t); } const s = localStorage.getItem('sc_speed'); if (s) UI.speed = +s; } catch (e) { }
  document.addEventListener('keydown', e => { if (BAT && e.code === 'Space') { BAT.paused = !BAT.paused; buildBattleCtrl(); e.preventDefault(); } });
  render();
})();

</script>
</body>
</html>
